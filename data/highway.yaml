# Agent vehicles on the homepage highway, and the rows of the process flow.
# Illustrative agents built around the tool types named on the AI agent
# implementation page (shared inboxes, a CRM, a project tool, a document
# system) plus the invoice example the owner asked for. The page says so in
# plain words under the hero. Money decisions always go to a person: that is
# a stated limit of the offer, so the procurement agent ends at "approval
# requested", never "paid".
#
# lane: 0 is the inside lane. offset: starting position along the road, 0-1.
# speed: relative cruising speed. color: accent for the roof beacon and dot.
bots:
  - id: inbox
    name: Inbox agent
    job: Email and calendar
    color: "#22d3ee"
    lane: 1
    offset: 0.08
    speed: 1.0
    events:
      - { icon: mail, text: New email }
      - { icon: mail, text: Email updated }
      - { icon: calendar, text: Calendar invite }
    done: { icon: check, text: Reply drafted }
    inputs: [mail, calendar, chat]
    output: Reply drafted for review
  - id: crm
    name: CRM agent
    job: Contacts and deals
    color: "#34d399"
    lane: 2
    offset: 0.3
    speed: 0.86
    events:
      - { icon: crm, text: CRM record added }
      - { icon: crm, text: Contact updated }
      - { icon: mail, text: Reply logged }
    done: { icon: check, text: Record up to date }
    inputs: [mail, crm, api]
    output: CRM record added and updated
  - id: project
    name: Project agent
    job: Tasks and status
    color: "#a78bfa"
    lane: 0
    offset: 0.52
    speed: 1.12
    events:
      - { icon: task, text: Project task updated }
      - { icon: chat, text: Team message }
      - { icon: sheet, text: Report rows filled }
    done: { icon: check, text: Status report ready }
    inputs: [task, chat, sheet]
    output: Weekly status report ready
  - id: procurement
    name: Procurement agent
    job: Invoices and orders
    color: "#fbbf24"
    lane: 3
    offset: 0.7
    speed: 0.78
    events:
      - { icon: invoice, text: Invoice matched }
      - { icon: sheet, text: Spreadsheet updated }
      - { icon: database, text: Order checked }
    done: { icon: check, text: Sent for approval }
    inputs: [invoice, sheet, database]
    output: Invoice matched, sent to a person to approve
  - id: docs
    name: Docs agent
    job: Documents and files
    color: "#60a5fa"
    lane: 1
    offset: 0.86
    speed: 0.95
    events:
      - { icon: doc, text: Document filed }
      - { icon: api, text: Folder synced }
      - { icon: doc, text: Brief drafted }
    done: { icon: check, text: Filed and linked }
    inputs: [doc, api, mail]
    output: Document filed and linked
