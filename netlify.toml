[build]
publish = "public"
command = "git submodule sync --recursive && git submodule update --init --recursive && npm run build"

[build.environment]
NODE_VERSION = "24"
WHATSAPP_NUMBER = "13057769385"

[context.production.environment]
HUGO_VERSION = "0.158.0"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"

[context.split1]
command = "git submodule sync --recursive && git submodule update --init --recursive && npm run build"

[context.split1.environment]
HUGO_VERSION = "0.158.0"
HUGO_ENV = "production"

[context.deploy-preview]
command = "git submodule sync --recursive && git submodule update --init --recursive && npm run build"

[context.deploy-preview.environment]
HUGO_VERSION = "0.158.0"

[context.branch-deploy]
command = "git submodule sync --recursive && git submodule update --init --recursive && npm run build"

[context.branch-deploy.environment]
HUGO_VERSION = "0.158.0"

[context.next.environment]
HUGO_ENABLEGITINFO = "true"

[[redirects]]
from = "/npmjs/*"
to = "/npmjs/"
status = 200

# CRO-7363: site map cleanup (Phase 1, approved by EV). These 5 pre-pivot
# service pages were removed (all draft: true, never published, no live
# traffic today). Redirects added anyway per EV's literal instruction that
# every removed or renamed page gets a 301, as a safety net, each pointing to
# the one live, sellable service rather than the homepage.
[[redirects]]
from = "/services/data-strategy/"
to = "/services/ai-agent-implementation/"
status = 301

[[redirects]]
from = "/services/growth-automation/"
to = "/services/ai-agent-implementation/"
status = 301

[[redirects]]
from = "/services/marketing/"
to = "/services/ai-agent-implementation/"
status = 301

[[redirects]]
from = "/services/operations-redesign/"
to = "/services/ai-agent-implementation/"
status = 301

[[redirects]]
from = "/services/web/"
to = "/services/ai-agent-implementation/"
status = 301
