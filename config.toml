# Hero section elements
hero_title = "Get AI agents shipped into your agency without hiring anyone"
hero_subtitle = "For founder-led agencies and small teams already running on real tools"
hero_CTA = "Get a free Live Audit"
hero_CTA_link = "/live-audit/"
hero_img= "images/featured/data-natural-beauty.png"
hero_description = "Start with a free Live Audit. Esteban reviews your actual tool stack with you, live, and names the first automation worth shipping."


# Mission section elements
mission_quote = "The teams we help usually are not short on dashboards. They are short on confidence that the numbers are trustworthy enough to drive profitable ecommerce decisions."
mission_author = "Esteban Valencia, Founder at EV Advisory"
mission_description = "We help ecommerce and Shopify teams rebuild trust in the information behind growth decisions. The goal is not more dashboards. The goal is faster, cleaner decisions backed by data your team can actually trust."

top_n_services_title = "What we fix first"
top_n_services_subtitle = "Start with signal quality, conversion leakage, and the reporting gaps that keep good teams from moving decisively."



#Case studies section elements
case_studies_title = "Testimonials"
case_studies_subtitle  = "See what we have done for our clients in the past"
case_studies_cta = "See all case studies and our free reference material &nbsp&rarr;"
case_studies_cta_link = "tags/case-study"
[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[frontmatter]
  # An explicit dateModified in front matter wins; otherwise the git commit date.
  lastmod = ["dateModified", ":default"]

[taxonomies]
category = "Categories"
tag = "Tags"

[related]
  includeNewer = true
  threshold = 80
  toLower = false
[[related.indices]]
  name = 'services'
  weight = 100
