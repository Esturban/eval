[module]
  [module.hugoVersion]
    extended = true
    min = "0.158.0"
    max = "0.158.0"
[[module.mounts]]
  source = 'content'
  target = 'content'
[[module.mounts]]
  source = 'assets'
  target = 'static/assets'
[[module.mounts]]
  source = 'static'
  target = 'static'
[[module.mounts]]
  source = 'layouts'
  target = 'layouts'
[[module.mounts]]
  source = 'data'
  target = 'data'

