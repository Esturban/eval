# Hero section elements
hero_title = "We ship a working AI agent into your systems in weeks, not months."
hero_title_follow = "Built into the tools you already run."
# Stack line: the hero sub-line and the tool-handling table both read it.
stack_line = "Microsoft, Google, SAP, Salesforce, or spreadsheets. We build on what you already run."
