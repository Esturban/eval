hero_description = "Walk away from one free 20-minute call already knowing which process to automate first and what it takes to ship it. We review your actual stack with you, live."


# Mission section elements
mission_quote = "Founder-led teams do not need more AI ideas. They need the Friday status updates, the intake emails, and the report assembly off their plate, handled by a working agent inside the tools they already run. That is what we build."
mission_author = "EV Advisory"
mission_description = "EV Advisory ships AI agents for founder-led agencies and service teams, starting with whichever repeated process costs the most time. Each agent is built into the tools you already use, measured before and after, and handed to an owner you already have. The goal is not more software. The goal is work off the founder's plate without adding headcount."

top_n_services_title = "Build Queue: your repeat work, shipped as AI agents, one at a time"
