  [languages.en]
    languageName = "English"
    weight = 1
  [languages.es]
    languageName = "Español"
    weight = 2

[security]
  [security.funcs]
    getenv = ['^HUGO_', '^CI$', '^WHATSAPP_NUMBER$']
  # Hugo 0.161+ can run Node.js tools (postcss, js.Build) with the --permission
  # flag, but that flag's name and stability vary across Node major versions
  # (this project's pinned production Node is 24; local dev machines may run
  # an older Node that rejects the flag outright). The scoped allowRead/
  # allowAddons keys below only narrow the sandbox when it is active; they do
  # not turn it off, so a Node version mismatch still breaks the build. This
  # project does not rely on that sandbox for anything, so disable it outright.
  [security.node.permissions]
    disable = true
