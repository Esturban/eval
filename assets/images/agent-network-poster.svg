<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid slice" focusable="false" role="img" aria-label="An agent node traveling between four tool nodes: Inbox, CRM, Project tool, and Documents">
