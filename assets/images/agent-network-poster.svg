    </radialGradient>
    <radialGradient id="anp-node" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#67e8f9" />
      <stop offset="1" stop-color="#0891b2" />
    </radialGradient>
  </defs>
  <rect width="960" height="540" fill="#020617" />
