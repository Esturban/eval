  { id: "d4l", k: "text", st: "label", col: "ink", al: "right", lines: ["Go live"], x: 772, y: 995, w: 200, h: 56 }
 ]}
];

/* Glyphs on a 64 grid, 6 px stroke at 64 (scaled with the glyph). */
const GLYPH = {
  inbox: '<path d="M14 6 H50 V30 H14 Z"/><path d="M14 8 L32 21 L50 8"/><path d="M6 38 H22 L26 45 H38 L42 38 H58 V58 H6 Z"/>',
  ticket: '<path d="M6 8 H58 V18 A6 6 0 0 0 58 30 V40 H6 V30 A6 6 0 0 0 6 18 Z"/><path d="M14 50 H50"/><path d="M14 59 H38"/>',
  crm: '<rect x="4" y="10" width="56" height="44" rx="6"/><circle cx="20" cy="28" r="8"/><path d="M11 45 Q20 37 29 45"/><path d="M36 26 H52"/><path d="M36 38 H48"/>',
  docs: '<path d="M12 6 H40 L52 18 V58 H12 Z"/><path d="M40 6 V18 H52"/><path d="M20 34 H44"/><path d="M20 45 H38"/>',
  chain: '<rect x="0" y="25" width="13" height="13" rx="2" fill="currentColor" stroke="none"/><rect x="18" y="25" width="13" height="13" rx="2" fill="currentColor" stroke="none"/><rect x="36" y="25" width="13" height="13" rx="2" fill="currentColor" stroke="none"/><path d="M13 31.5 H18 M31 31.5 H36 M49 31.5 H55" stroke-width="4" stroke-linecap="butt"/><path d="M54 23 L64 31.5 L54 40 Z" fill="currentColor" stroke="none"/>',
  check: '<path d="M12 34 L26 48 L52 18" stroke-width="8"/>',
  flag: '<path d="M18 58 V6"/><path d="M18 8 H50 L42 20 L50 32 H18" fill="currentColor"/>',
  person: '<circle cx="32" cy="22" r="10"/><path d="M14 54 A18 16 0 0 1 50 54"/>'
};

function el(tag, attrs, inner) {
  const a = Object.entries(attrs).map(([k, v]) => `${k}="${v}"`).join(" ");
  return `<${tag} ${a}>${inner || ""}</${tag}>`;
}
function glyph(g, x, y, s, col) {
  const c = col || C.ink;
  return `<g transform="translate(${x} ${y}) scale(${s / 64})" fill="none" stroke="${c}" color="${c}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">${GLYPH[g]}</g>`;
}
function rrect(x, y, w, h, r, fill, stroke, sw) {
  const i = sw ? sw / 2 : 0;
  return el("rect", { x: x + i, y: y + i, width: w - 2 * i, height: h - 2 * i, rx: Math.max(0, r - i), fill, stroke: stroke || "none", "stroke-width": sw || 0 });
}
function bars(x, y, w, n, col, bh, gap) {
  const widths = [0.6, 0.8, 0.45]; const h = bh || 18; const g = gap || 14;
  let out = "";
  for (let i = 0; i < n; i += 1) out += el("rect", { x, y: y + i * (h + g), width: w * widths[i], height: h, rx: h / 2, fill: col });
  return out;
}
function badge(x, y) {
  return el("circle", { cx: x + 32, cy: y + 32, r: 29.5, fill: C.accent, stroke: C.ink, "stroke-width": 5 }) + glyph("check", x + 12, y + 12, 40, C.ink);
}
function person(x, y, d, dim) {
  const sw = Math.max(3, 5 * d / 120); const cx = x + d / 2;
  const inner = Math.max(3.5, 6 * d / 120); const col = dim ? C.slate : C.ink;
  const hr = d * 16 / 120; const hy = y + d * 0.38; const sx = d * 0.25; const sy = y + d * 0.80;
  return el("circle", { cx, cy: y + d / 2, r: d / 2 - sw / 2, fill: C.card, stroke: col, "stroke-width": sw }) +
    el("circle", { cx, cy: hy, r: hr, fill: "none", stroke: col, "stroke-width": inner }) +
    el("path", { d: `M${cx - sx} ${sy} A${sx} ${d * 0.2} 0 0 1 ${cx + sx} ${sy}`, fill: "none", stroke: col, "stroke-width": inner, "stroke-linecap": "round" });
}

const LINE = {
  manual: { core: C.muted, w: 6, dash: "18 14", head: 18 },
  agent: { casing: C.ink, cw: 14, core: C.accent, w: 8, head: 22 },
  plain: { core: C.graphite, w: 6, head: 18 }
};
function lineBox(b) {
  const s = LINE[b.style]; const half = (s.cw || s.w) / 2; const head = b.arrow ? s.head * 0.55 : 0;
  const xs = b.pts.map(p => p[0]); const ys = b.pts.map(p => p[1]);
  const vertical = xs[0] === xs[xs.length - 1];
  const pad = Math.max(half, head);
  return vertical
    ? { x: Math.min(...xs) - pad, y: Math.min(...ys), w: 2 * pad, h: Math.max(...ys) - Math.min(...ys) }
    : { x: Math.min(...xs), y: Math.min(...ys) - pad, w: Math.max(...xs) - Math.min(...xs), h: 2 * pad };
}
function drawLine(b) {
  const s = LINE[b.style]; const pts = b.pts.map(p => p.slice());
  let head = "";
  if (b.arrow) {
    const [x1, y1] = pts[pts.length - 2]; const [x2, y2] = pts[pts.length - 1];
    const L = Math.hypot(x2 - x1, y2 - y1); const ux = (x2 - x1) / L; const uy = (y2 - y1) / L;
    const hl = s.head; const hw = s.head * 0.55;
    const bx = x2 - ux * hl; const by = y2 - uy * hl;
    const fill = b.style === "agent" ? C.ink : (b.col ? C[b.col] : s.core);
    head = el("path", { d: `M${x2} ${y2} L${bx - uy * hw} ${by + ux * hw} L${bx + uy * hw} ${by - ux * hw} Z`, fill });
    pts[pts.length - 1] = [bx + ux * 2, by + uy * 2];
  }
  const d = "M" + pts.map(p => p.join(" ")).join(" L");
  const col = b.col ? C[b.col] : s.core;
  let out = "";
  if (s.casing) out += el("path", { d, fill: "none", stroke: s.casing, "stroke-width": s.cw, "stroke-linecap": "butt" });
  const attrs = { d, fill: "none", stroke: col, "stroke-width": s.w, "stroke-linecap": b.style === "agent" || b.arrow ? "butt" : "round" };
  if (s.dash) { attrs["stroke-dasharray"] = b.short ? "6 5" : s.dash; if (b.short) attrs["stroke-linecap"] = "butt"; }
  out += el("path", attrs);
  return out + head;
}

const CARD_STYLE = {
  dim: { fill: C.dimFill, stroke: C.dimStroke, sw: 3 },
  default: { fill: C.card, stroke: C.graphite, sw: 4 },
  strong: { fill: C.card, stroke: C.ink, sw: 6 },
  active: { fill: C.card, stroke: C.ink, sw: 6, band: true },
  approved: { fill: C.card, stroke: C.ink, sw: 6 }
};
let clipN = 0;
function drawCard(b) {
  const s = CARD_STYLE[b.state]; const r = b.r || 24;
  let out = rrect(b.x, b.y, b.w, b.h, r, s.fill);
  if (s.band) {
    clipN += 1; const id = "clip" + clipN;
    out += `<clipPath id="${id}">${rrect(b.x, b.y, b.w, b.h, r, "#000")}</clipPath>`;
    out += el("rect", { x: b.x, y: b.y, width: 20, height: b.h, fill: C.accent, "clip-path": `url(#${id})` });
  }
  return out + rrect(b.x, b.y, b.w, b.h, r, "none", s.stroke, s.sw);
}
function drawChip(b) {
  const active = b.state === "active"; const approved = b.state === "approved";
  const fill = active ? C.accent : C.card; const stroke = active || approved ? C.ink : C.graphite;
  const sw = approved ? 6 : 4; const barCol = active ? C.ink : C.rule;
  const big = b.h >= 90; const pad = big ? 24 : 12; const bh = big ? 18 : 10; const gap = big ? 14 : 8;
  const inner = (approved ? b.w - 96 : b.w) - 2 * pad;
  const by = b.y + (b.h - (2 * bh + gap)) / 2;
  const widths = [0.8, 0.55];
  let out = rrect(b.x, b.y, b.w, b.h, 16, fill, stroke, sw);
  for (let i = 0; i < 2; i += 1) out += el("rect", { x: b.x + pad, y: by + i * (bh + gap), width: inner * widths[i], height: bh, rx: bh / 2, fill: barCol });
  return out;
}
function drawStep(b) {
  const s = b.s;
  if (b.v === "done") return rrect(b.x, b.y, s, s, 16, C.ink) + glyph("check", b.x + 16, b.y + 16, 40, C.card);
  if (b.v === "active") return rrect(b.x, b.y, s, s, 16, C.accent, C.ink, 4) + glyph("chain", b.x + 16, b.y + 16, 40, C.ink);
  return rrect(b.x, b.y, s, s, 16, C.card, C.graphite, 4) + glyph("person", b.x + 12, b.y + 12, 48, C.ink);
}
function drawStage(b) {
  /* Completed stages: solid ink tile, white glyph. Live stage: accent with ink stroke. Otherwise default. */
  const s = 72;
  if (b.done) return rrect(b.x, b.y, s, s, 16, C.ink) + glyph(b.g, b.x + 16, b.y + 16, 40, C.card);
  if (b.live) return rrect(b.x, b.y, s, s, 16, C.accent, C.ink, 4) + glyph(b.g, b.x + 16, b.y + 16, 40, C.ink);
  return rrect(b.x, b.y, s, s, 16, C.card, C.graphite, 4) + glyph(b.g, b.x + 16, b.y + 16, 40, C.ink);
}

const DRAW = {
  card: drawCard, chip: drawChip, step: drawStep, stage: drawStage,
  glyph: b => glyph(b.g, b.x, b.y, b.s, b.col ? C[b.col] : C.ink),
  person: b => person(b.x, b.y, b.d, b.dim),
  badge: b => badge(b.x, b.y),
  check: b => glyph("check", b.x, b.y, b.s, C.ink),
  line: drawLine,
  bars: b => bars(b.x, b.y, b.w, b.n, C[b.col]),
  panel: b => rrect(b.x, b.y, b.w, b.h, 16, C.bg) + bars(b.x + 28, b.y + 46, b.w - 56, 3, C.rule),
  pill: b => rrect(b.x, b.y, b.w, b.h, b.r || b.h / 2, C[b.fill], C[b.stroke], b.sw),
  rail: b => rrect(b.x, b.y, b.w, b.h, 6, C.graphite),
  window: b => rrect(b.x, b.y, b.w, b.h, 10, C.ink) + rrect(b.x + 4, b.y + 4, b.w - 8, b.h - 8, 6, C.accent),
  tick: b => rrect(b.x, b.y, b.w, b.h, 3, C.graphite),
  decor: b => b.pts.map(p => el("path", { d: `M${p[0].join(" ")} L${p[1].join(" ")}`, stroke: C.muted, "stroke-width": 6, "stroke-dasharray": "18 14", "stroke-linecap": "round", fill: "none", opacity: 0.35 })).join("")
};

/* Box for any block (outer bounds). */
function boxOf(b) {
  if (b.k === "line") return lineBox(b);
  if (b.k === "person") return { x: b.x, y: b.y, w: b.d, h: b.d };
  if (b.k === "glyph" || b.k === "check") return { x: b.x, y: b.y, w: b.s, h: b.s };
  if (b.k === "badge") return { x: b.x, y: b.y, w: 64, h: 64 };
  if (b.k === "step") return { x: b.x, y: b.y, w: b.s, h: b.s };
  if (b.k === "stage") return { x: b.x, y: b.y, w: 72, h: 72 };
  if (b.k === "bars") return { x: b.x, y: b.y, w: b.w * 0.8, h: (b.n - 1) * 32 + 18 };
  return { x: b.x, y: b.y, w: b.w, h: b.h };
}

/* Entrance as a pure function of the frame: critically damped spring, 24 px rise, no overshoot. */
function progress(b, beat, frame) {
  const at = b.at || 0; const dur = b.dur === 0 ? 0 : (b.dur || 60);
  const t = frame - beat.start - at;
  if (dur === 0) return t >= 0 ? 1 : 0;
  if (t <= 0) return 0;
  if (t >= dur) return 1;
  const x = 9.23 * t / dur;
  return 1 - (1 + x) * Math.exp(-x);
}

function render(beat, frame) {
  const svg = document.getElementById("art"); const stage = document.getElementById("stage");
  let markup = rrect(0, 0, 1080, 1350, 0, C.bg);
  const texts = [];
  for (const b of beat.blocks) {
    const p = progress(b, beat, frame); const ty = 24 * (1 - p);
    if (b.k === "text") { texts.push({ b, p, ty }); continue; }
    markup += `<g data-id="${b.id}" opacity="${p}" transform="translate(0 ${ty})">${DRAW[b.k](b)}</g>`;
  }
  svg.innerHTML = markup;
  for (const { b, p, ty } of texts) {
    const ts = TYPE[b.st]; const d = document.createElement("div");
    d.className = "t"; d.dataset.id = b.id;
    Object.assign(d.style, { left: b.x + "px", top: b.y + "px", width: b.w + "px", height: b.h + "px",
      font: `${ts.wt} ${ts.size}px/${ts.lh}px "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif`,
      letterSpacing: ts.track + "em", color: C[b.col], textAlign: b.al || "left", opacity: p, transform: `translateY(${ty}px)` });
    for (const line of b.lines) {
      const ln = document.createElement("div"); ln.className = "ln";
      const sp = document.createElement("span"); sp.textContent = line;
      const base = document.createElement("i"); base.style.cssText = "display:inline-block;width:0;height:0";
      /* Left-aligned lines whose first glyph overhangs its origin get that overhang as padding, so ink never crosses x 108. */
      const m = inkMetrics(ts, line);
      if ((b.al || "left") === "left" && m.left > 0) ln.style.paddingLeft = Math.ceil(m.left) + "px";
      ln.appendChild(sp); ln.appendChild(base); d.appendChild(ln);
    }
    stage.appendChild(d);
  }
}

const MCTX = document.createElement("canvas").getContext("2d");
function inkMetrics(ts, text) {
  MCTX.font = `${ts.wt} ${ts.size}px "Instrument Sans"`;
  MCTX.letterSpacing = (ts.track * ts.size) + "px";
  const m = MCTX.measureText(text);
  return { left: m.actualBoundingBoxLeft, right: m.actualBoundingBoxRight, ascent: m.actualBoundingBoxAscent, descent: m.actualBoundingBoxDescent };
}

/* Automated checks. */
function lum(hex) {
  const v = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255).map(c => (c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)));
  return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
}
function contrast(a, b) { const [l1, l2] = [lum(a), lum(b)].sort((x, y) => y - x); return (l1 + 0.05) / (l2 + 0.05); }
function inter(a, b) { return Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x)) * Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y)); }
function contains(o, i) { return i.x >= o.x - 0.5 && i.y >= o.y - 0.5 && i.x + i.w <= o.x + o.w + 0.5 && i.y + i.h <= o.y + o.h + 0.5; }
function fillOf(b) {
  if (b.k === "card") return CARD_STYLE[b.state].fill;
  if (b.k === "pill") return C[b.fill];
  if (b.k === "chip") return b.state === "active" ? C.accent : C.card;
  if (b.k === "panel") return C.bg;
  return null;
}
const FORBIDDEN = [new RegExp(String.fromCharCode(8212)), new RegExp("-{2}"), /\b(CRO|DEV|PAD|TASK|OPS|CMO|CFO)-\d+/];

function check(beat, frame) {
  const fails = []; const rows = [];
  const fontsOk = document.fonts.check('700 104px "Instrument Sans"') && document.fonts.check('600 48px "Instrument Sans"') &&
    [...document.fonts].filter(f => f.family.includes("Instrument Sans") && f.status === "loaded").length >= 2;
  if (!fontsOk) fails.push("font: Instrument Sans not loaded");
  const blocks = beat.blocks.map(b => ({ b, box: boxOf(b) }));
  for (const { b } of blocks) {
    const pr = progress(b, beat, frame);
    if (pr !== 1) fails.push(`motion: ${b.id} progress ${pr.toFixed(4)} at frame ${frame}`);
  }
  for (const { b, box } of blocks.filter(o => o.b.k === "text")) {
    const node = document.querySelector(`.t[data-id="${b.id}"]`);
    const ts = TYPE[b.st];
    const spans = [...node.querySelectorAll("span")];
    const lns = [...node.querySelectorAll(".ln")];
    const maxW = Math.max(...spans.map(s => s.getBoundingClientRect().width));
    /* Real ink bounds per line: glyph extents from canvas metrics, placed at the measured baseline. */
    const inks = spans.map((s, i) => {
      const r = s.getBoundingClientRect(); const m = inkMetrics(ts, b.lines[i]);
      const baseY = lns[i].querySelector("i").getBoundingClientRect().bottom;
      return { x0: r.left - m.left, x1: r.left + m.right, y0: baseY - m.ascent, y1: baseY + m.descent };
    });
    const inkBox = { x: Math.min(...inks.map(k => k.x0)), y: Math.min(...inks.map(k => k.y0)), w: 0, h: 0 };
    inkBox.w = Math.max(...inks.map(k => k.x1)) - inkBox.x; inkBox.h = Math.max(...inks.map(k => k.y1)) - inkBox.y;
    const lineSum = lns.reduce((a, l) => a + l.getBoundingClientRect().height, 0);
    if (maxW > box.w + 0.01) fails.push(`overflow: ${b.id} widest line ${maxW.toFixed(1)} > box ${box.w}`);
    if (lineSum > box.h + 0.01) fails.push(`overflow: ${b.id} line boxes ${lineSum} > box h ${box.h}`);
    if (!contains(box, inkBox)) fails.push(`overflow: ${b.id} glyph ink ${JSON.stringify(inkBox)} leaves its box`);
    if (spans.map(s => s.textContent).join("|") !== b.lines.join("|")) fails.push(`words: ${b.id} rendered text differs from BEATS`);
    for (const re of FORBIDDEN) if (re.test(b.lines.join(" "))) fails.push(`forbidden: ${b.id} ${re}`);
    const holders = blocks.filter(o => o.b.k !== "text" && fillOf(o.b) && contains(o.box, box)).sort((a, c) => a.box.w * a.box.h - c.box.w * c.box.h);
    const bg = holders.length ? fillOf(holders[0].b) : C.bg;
    const fg = C[b.col]; const ratio = contrast(fg, bg);
    if (ratio < 7) fails.push(`contrast: ${b.id} ${ratio.toFixed(2)}:1 below 7:1`);
    rows.push({ id: b.id, text: b.lines.join(" / "), widest: Math.round(maxW), boxW: box.w, slack: Math.round(box.w - maxW), fg, bg, ratio: ratio.toFixed(2), ink: inkBox });
  }
  for (const { b, box } of blocks) {
    if (box.x < SAFE.x0 || box.y < SAFE.y0 || box.x + box.w > SAFE.x1 || box.y + box.h > SAFE.y1) fails.push(`safe-zone: ${b.id} ${JSON.stringify(box)}`);
  }
  for (const r of rows) { const i = r.ink; if (i.x < SAFE.x0 - 0.5 || i.x + i.w > SAFE.x1 + 0.5) fails.push(`safe-zone ink: ${r.id}`); }
  for (const { b, box } of blocks.filter(o => o.b.k !== "text" && o.b.k !== "decor")) {
    const g = document.querySelector(`g[data-id="${b.id}"]`); const bb = g.getBBox();
    if (bb.x < box.x - 1 || bb.y < box.y - 1 || bb.x + bb.width > box.x + box.w + 1 || bb.y + bb.height > box.y + box.h + 1) fails.push(`geometry: ${b.id} drawn outside its box`);
  }
  let pairs = 0;
  for (let i = 0; i < blocks.length; i += 1) for (let j = i + 1; j < blocks.length; j += 1) {
    const A = blocks[i]; const B = blocks[j]; const area = inter(A.box, B.box);
    pairs += 1; if (area <= 0.5) continue;
    const ta = A.b.k === "text"; const tb = B.b.k === "text";
    if (ta && tb) { fails.push(`collision: text ${A.b.id} x text ${B.b.id}`); continue; }
    if (ta || tb) {
      const T = ta ? A : B; const S = ta ? B : A;
      if (S.b.k === "decor" || !(fillOf(S.b) && contains(S.box, T.box))) fails.push(`collision: text ${T.b.id} x ${S.b.id}`);
      continue;
    }
    if (A.b.k === "decor" || B.b.k === "decor") continue;
    if (contains(A.box, B.box) || contains(B.box, A.box)) continue;
    if (A.b.under || B.b.under) continue;
    if ((A.b.joins || []).includes(B.b.id) || (B.b.joins || []).includes(A.b.id)) continue;
    fails.push(`collision: ${A.b.id} x ${B.b.id}`);
  }
  return { beat: beat.n, frame, fontsOk, textBlocks: rows.length, pairsChecked: pairs, rows, fails };
}

const params = new URLSearchParams(location.search);
const beat = BEATS[(Number(params.get("beat")) || 1) - 1];
const frame = params.has("frame") ? Number(params.get("frame")) : beat.mid;
Promise.all([document.fonts.load('700 104px "Instrument Sans"'), document.fonts.load('600 48px "Instrument Sans"')]).then(() => document.fonts.ready).then(() => {
  render(beat, frame);
  requestAnimationFrame(() => { window.__report = check(beat, frame); });
});
</script>
</body>
