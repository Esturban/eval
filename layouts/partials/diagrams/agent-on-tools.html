{{- /* How an agent sits on the client's tools. Dark card in both themes. Uses only claims already on the offer page. */ -}}
<figure class="not-prose aot" aria-label="How an agent sits on your tools">
<style>
.aot{margin:2rem 0;padding:1.5rem 1.25rem;border-radius:1.5rem;background:#020617;border:1px solid #1e293b;color:#e2e8f0}
.aot-grid{display:grid;grid-template-columns:1fr;gap:.25rem;align-items:center}
.aot-col-h{margin:0 0 .5rem;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.8125rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#67e8f9}
.aot-tools{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.aot-tools li{margin:0;padding:.625rem .75rem;border:1px solid #334155;border-radius:.875rem;background:#0f172a;font-size:1rem;line-height:1.3;font-weight:600;color:#f1f5f9;display:flex;align-items:center;gap:.5rem}
.aot-tools svg{width:1.25rem;height:1.25rem;flex:none;fill:none;stroke:#67e8f9;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.aot-agent{border:2px solid var(--ev-accent);border-radius:1.25rem;background:#0b1f2e;padding:1rem 1.125rem}
.aot-agent .aot-name{margin:0;font-size:1.25rem;line-height:1.25;font-weight:800;color:#fff}
.aot-agent p{margin:.375rem 0 0;font-size:1rem;line-height:1.5;color:#cbd5e1}
.aot-person{border:1px solid #34d399;border-radius:1.25rem;background:#0f172a;padding:1rem 1.125rem}
.aot-person .aot-name{margin:0;font-size:1.125rem;line-height:1.25;font-weight:800;color:#fff}
.aot-person p{margin:.375rem 0 0;font-size:1rem;line-height:1.5;color:#cbd5e1}
.aot-arrow{display:flex;justify-content:center;color:#67e8f9;height:2rem}
.aot-arrow svg{width:1.5rem;height:2rem;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.aot-foot{margin:1.25rem 0 0;padding-top:1rem;border-top:1px solid #1e293b;font-size:1rem;line-height:1.5;color:#cbd5e1}
.aot-foot strong{color:#fff}
@media(min-width:760px){
.aot{padding:1.75rem}
.aot-grid{grid-template-columns:1.1fr 2rem 1.2fr 2rem 1fr;gap:.5rem}
.aot-arrow{height:auto}
.aot-arrow svg{transform:rotate(-90deg)}
}
</style>
<div class="aot-grid">
<div><p class="aot-col-h">Your tools</p>
<ul class="aot-tools">
<li><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>Inbox</li>
<li><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-4 3-6 6.500-6s6 2 6.500 6M16 5.500a3 3 0 0 1 0 5.500M18 14c2 .8 3.200 2.800 3.500 6"/></svg>CRM</li>
<li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>Docs</li>
<li><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></svg>Projects</li>
</ul></div>
<div class="aot-arrow" aria-hidden="true"><svg viewBox="0 0 24 32"><path d="M12 3v24m-6-7l6 7l6-7"/></svg></div>
<div class="aot-agent"><p class="aot-col-h">The agent</p><p class="aot-name">Runs inside your accounts</p><p>Least-privilege access. Revocable without calling us.</p></div>
<div class="aot-arrow" aria-hidden="true"><svg viewBox="0 0 24 32"><path d="M12 3v24m-6-7l6 7l6-7"/></svg></div>
<div class="aot-person"><p class="aot-col-h" style="color:#6ee7b7">Your team</p><p class="aot-name">A person approves</p><p>You review outputs and can pause it.</p></div>
</div>
<figcaption class="aot-foot"><strong>You own every account.</strong> If you cancel, the agents keep running.</figcaption>
</figure>
