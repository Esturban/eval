{{ define "main" }}
<article>

    <header class="bg-slate-950">
        <div class="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8">
            <p class="font-mono text-xs font-semibold uppercase tracking-[0.24em] text-cyan-300">{{ .Params.eyebrow }}</p>
            <h1 class="mt-4 max-w-4xl text-4xl font-black tracking-tight text-white md:text-5xl">{{ .Params.headline }}</h1>
            <p class="mt-6 max-w-2xl text-lg leading-8 text-slate-300">{{ .Params.lede }}</p>
            <div class="mt-8 flex flex-wrap items-center gap-4">
                <a href="{{ .Params.cta_link }}" class="inline-flex items-center justify-center rounded-full bg-cyan-400 px-6 py-3 text-sm font-semibold text-slate-950 transition hover:bg-cyan-300">{{ .Params.cta_text }}</a>
                <p class="font-mono text-xs uppercase tracking-[0.2em] text-slate-400">{{ .Params.cta_note }}</p>
            </div>
        </div>
    </header>

    <section class="bg-stone-50 py-16 sm:py-20">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
            <div class="grid gap-4">
                {{ range .Params.sections }}
                <div class="grid gap-3 rounded-3xl border border-slate-200 bg-white p-6 sm:p-8 lg:grid-cols-[220px_minmax(0,1fr)] lg:gap-8">
                    <p class="font-mono text-xs font-semibold uppercase tracking-[0.24em] text-cyan-600">{{ .eyebrow }}</p>
                    <div>
                        <h2 class="text-2xl font-semibold tracking-tight text-slate-950">{{ .heading }}</h2>
                        <p class="mt-3 max-w-2xl text-lg leading-8 text-slate-600">{{ .body }}</p>
                    </div>
                </div>
                {{ end }}
            </div>
        </div>
    </section>

</article>
{{ end }}
